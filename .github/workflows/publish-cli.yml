name: Publish CLI

on:
  workflow_dispatch:
    inputs:
      npm_tag:
        description: npm distribution tag
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next

concurrency:
  group: publish-cli
  cancel-in-progress: false

jobs:
  publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Read CLI version
        id: package
        working-directory: apps/cli
        run: node -e "console.log('version=' + require('./package.json').version)" >> "$GITHUB_OUTPUT"

      - name: Verify matching Docker image
        run: docker buildx imagetools inspect "draftila/draftila:${{ steps.package.outputs.version }}"

      - name: Verify version is unpublished
        env:
          CLI_VERSION: ${{ steps.package.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view "draftila@$CLI_VERSION" version >/dev/null 2>&1; then
            echo "Version $CLI_VERSION is already published to npm" >&2
            exit 1
          fi

      - name: Typecheck CLI
        run: bun run --filter draftila typecheck

      - name: Test CLI
        run: bun run --filter draftila test

      - name: Build CLI
        run: bun run --filter draftila build

      - name: Verify package contents
        working-directory: apps/cli
        run: npm pack --dry-run

      - name: Publish CLI
        working-directory: apps/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --tag "${{ inputs.npm_tag }}" --provenance
