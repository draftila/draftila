name: Publish CLI

on:
  workflow_dispatch:
    inputs:
      npm_tag:
        description: npm distribution tag
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next

concurrency:
  group: publish-cli
  cancel-in-progress: false

jobs:
  package:
    name: Package ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-x64
            runner: ubuntu-24.04
          - target: win32-x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Read CLI version
        id: package
        shell: bash
        run: node -e "console.log('version=' + require('./apps/cli/package.json').version)" >> "$GITHUB_OUTPUT"

      - name: Build web application
        run: bun run --filter @draftila/web build

      - name: Build native runtime
        run: bun run cli:runtime:build -- --version "${{ steps.package.outputs.version }}" --target "${{ matrix.target }}" --outdir runtime-dist

      - name: Smoke test native runtime
        run: bun run scripts/smoke-cli-runtime.ts --runtime-dir runtime-dist --version "${{ steps.package.outputs.version }}"

      - name: Create runtime archive
        shell: bash
        env:
          CLI_VERSION: ${{ steps.package.outputs.version }}
          RUNTIME_TARGET: ${{ matrix.target }}
        run: tar -czf "draftila-runtime-v${CLI_VERSION}-${RUNTIME_TARGET}.tar.gz" -C runtime-dist .

      - name: Upload runtime archive
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.target }}
          path: draftila-runtime-v${{ steps.package.outputs.version }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish npm package and runtime release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Read CLI version
        id: package
        run: node -e "console.log('version=' + require('./apps/cli/package.json').version)" >> "$GITHUB_OUTPUT"

      - name: Verify CLI version is unpublished
        env:
          CLI_VERSION: ${{ steps.package.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view "draftila@$CLI_VERSION" version >/dev/null 2>&1; then
            echo "Version $CLI_VERSION is already published to npm" >&2
            exit 1
          fi

      - name: Download runtime archives
        uses: actions/download-artifact@v4
        with:
          pattern: runtime-*
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        working-directory: release-assets
        run: sha256sum draftila-runtime-*.tar.gz > checksums.txt

      - name: Typecheck CLI
        run: bun run --filter draftila typecheck

      - name: Test CLI
        run: bun run --filter draftila test

      - name: Build CLI
        run: bun run --filter draftila build

      - name: Verify package contents
        working-directory: apps/cli
        run: npm pack --dry-run

      - name: Create CLI runtime release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_VERSION: ${{ steps.package.outputs.version }}
        run: |
          gh release create "cli-v$CLI_VERSION" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Draftila CLI v$CLI_VERSION" \
            --notes "Native runtimes for the Draftila CLI. This release is independent from the server and Docker release cycle." \
            --latest=false

      - name: Publish CLI
        working-directory: apps/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --tag "${{ inputs.npm_tag }}"

      - name: Remove incomplete runtime release
        if: failure() && steps.release.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_VERSION: ${{ steps.package.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if ! npm view "draftila@$CLI_VERSION" version >/dev/null 2>&1; then
            gh release delete "cli-v$CLI_VERSION" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi
